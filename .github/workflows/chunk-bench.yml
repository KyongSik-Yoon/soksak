# Would cutting a dictation at pauses and decoding the pieces while the user is still talking
# (so only the last piece is left when they stop) cost Turbo ACFT accuracy? Measures CER and the
# wait after stop, whole vs chunked, on Korean code-switched dictation (TTS) and real Korean
# speech (FLEURS). See scripts/chunk_bench_*.py.
name: Bench chunked Turbo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/chunk-bench.yml, scripts/chunk_bench_*.py]

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q edge-tts soundfile numpy huggingface_hub
      - run: python scripts/chunk_bench_data.py audio
      - uses: actions/upload-artifact@v4
        with: { name: audio, path: "audio/*.wav\naudio/clips.json" }

  run:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        set: [codeswitch, fleurs]
        method: [whole, chunked]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q soundfile numpy
      - uses: actions/download-artifact@v4
        with: { name: audio, path: audio }
      - name: Build whisper-cli (v1.7.4, as vendored in the app)
        run: |
          git clone -q --depth 1 --branch v1.7.4 https://github.com/ggml-org/whisper.cpp wcpp
          cmake -S wcpp -B wcpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DWHISPER_BUILD_TESTS=OFF >/dev/null
          cmake --build wcpp/build -j4 --target whisper-cli >/dev/null
      - name: Fetch Turbo ACFT q4
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download model-acft-large-v3-turbo-q4_0 -R "$GITHUB_REPOSITORY" -p '*.bin'
      - run: python scripts/chunk_bench_run.py audio wcpp/build/bin/whisper-cli ggml-acft-large-v3-turbo-q4_0.bin ${{ matrix.method }} ${{ matrix.set }} ${{ matrix.set }}-${{ matrix.method }}.json
      - uses: actions/upload-artifact@v4
        with: { name: "res-${{ matrix.set }}-${{ matrix.method }}", path: "${{ matrix.set }}-${{ matrix.method }}.json" }

  report:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: results, pattern: "res-*" }
      - run: python3 scripts/chunk_bench_report.py results
