# Benchmarks the app's speech models on Korean speech (FLEURS ko_kr test): CER and decode time.
# See scripts/bench_models.py. Runs when this file or the script changes, or by hand.
name: Bench speech models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/bench-models.yml, scripts/bench_models.py]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      W: ${{ github.workspace }}/bench
      N: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -q sherpa-onnx==2.0.1 soundfile numpy huggingface_hub

      - name: Build whisper-cli (v1.7.4, as vendored in the app)
        run: |
          set -e
          git clone -q --depth 1 --branch v1.7.4 https://github.com/ggml-org/whisper.cpp wcpp
          cmake -S wcpp -B wcpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DWHISPER_BUILD_TESTS=OFF >/dev/null
          cmake --build wcpp/build -j4 --target whisper-cli >/dev/null
          mkdir -p "$W" && cp wcpp/build/bin/whisper-cli "$W/"

      - name: Fetch models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p "$W/models" && cd "$W/models"
          S=https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models
          for b in sherpa-onnx-moonshine-tiny-ko-quantized-2026-02-27 sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17 sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17; do
            curl -fsSL --retry 5 --retry-all-errors -o "$b.tar.bz2" "$S/$b.tar.bz2" && tar xjf "$b.tar.bz2" && rm "$b.tar.bz2"
          done
          gh release download model-moonshine-base-ko -R "$GITHUB_REPOSITORY" -p '*.tar.bz2' && tar xjf sherpa-onnx-moonshine-base-ko-quantized.tar.bz2
          gh release download model-acft-large-v3-turbo-q4_0 -R "$GITHUB_REPOSITORY" -p '*.bin'
          curl -fsSL --retry 5 --retry-all-errors -o small_acft_q8_0.bin https://voiceinput.futo.org/VoiceInput/small_acft_q8_0.bin
          ls -la

      - name: Fetch FLEURS ko_kr test
        run: |
          set -e
          mkdir -p "$W/data" && cd "$W/data"
          python - <<'PY'
          import shutil
          from huggingface_hub import hf_hub_download as d
          for f in ["data/ko_kr/test.tsv", "data/ko_kr/audio/test.tar.gz"]:
              shutil.copy(d("google/fleurs", f, repo_type="dataset"), f.split("/")[-1])
          PY
          tar xzf test.tar.gz && ls test | head -3 && ls test | wc -l

      - name: Bench
        run: python scripts/bench_models.py "$W" "$N"
