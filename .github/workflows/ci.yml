name: CI

on:
  push:
    branches: [main]
    # Harness/doc-only commits don't make a new app build (and so no update prompt on the phone).
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "scripts/**"
      # Benchmarks and model packaging have their own workflows; they don't change the app.
      - ".github/workflows/bench-models.yml"
      - ".github/workflows/chunk-bench.yml"
      - ".github/workflows/route-bench.yml"
      - ".github/workflows/npu-bench.yml"
  pull_request:
  workflow_dispatch:

jobs:
  # libsherpa-onnx-jni.so rebuilt with Qualcomm NPU (QNN) support — the published AAR has none —
  # plus the QNN runtime pieces for Hexagon v81 (Snapdragon 8 Elite Gen 5, NpuSupport.kt). Same
  # sherpa-onnx tag as the AAR, so the AAR's Kotlin classes match these JNI symbols. Cached: the
  # ~20 min build only reruns when the key changes. Headers and runtime libs come from
  # sherpa-onnx's public asr-models-qnn release (QAIRT 2.40), as its own QNN APK builds do.
  sherpa-qnn:
    name: sherpa-onnx JNI with QNN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: qnn-out
          key: sherpa-qnn-jni-v2.0.1-qairt2.40.0.251030-v81-r1
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -ex
          V=2.40.0.251030
          git clone -q --depth 1 --branch v2.0.1 https://github.com/k2-fsa/sherpa-onnx s
          cd s
          gh release download asr-models-qnn -R k2-fsa/sherpa-onnx -p "qnn-include-$V.tar.bz2" -p "qnn-libs-$V.tar.bz2"
          tar xf "qnn-include-$V.tar.bz2" && tar xf "qnn-libs-$V.tar.bz2"
          ls qnn-libs-$V
          export QNN_SDK_ROOT=$PWD/qnn-include-$V
          export SHERPA_ONNX_ENABLE_QNN=ON SHERPA_ONNX_ENABLE_TTS=OFF SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF
          export SHERPA_ONNX_ENABLE_BINARY=OFF BUILD_SHARED_LIBS=OFF
          export ANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          export LDFLAGS="-Wl,-z,max-page-size=16384"
          ./build-android-arm64-v8a.sh > build.log 2>&1 || { tail -80 build.log; exit 1; }
          tail -5 build.log
          mkdir -p ../qnn-out
          cp -v build-android-arm64-v8a-static/install/lib/libsherpa-onnx-jni.so ../qnn-out/
          for f in libQnnHtp.so libQnnHtpPrepare.so libQnnSystem.so libQnnHtpV81Stub.so libQnnHtpV81Skel.so; do
            cp -v "qnn-libs-$V/$f" ../qnn-out/
          done
          ls -la ../qnn-out
      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-qnn
          path: qnn-out

  android:
    name: Android build & unit tests
    needs: sherpa-qnn
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish each main build as a release (Obtainium updates from it)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools". Google removed the obsolete "tools"
          # package from the SDK repository, so sdkmanager now exits 1 on it and
          # this step fails before anything is built — every Android run since
          # 2026-09-16 died here. We only need platform-tools; the NDK and CMake
          # come from the next step, and Gradle fetches platforms/build-tools.
          packages: platform-tools

      - name: Install NDK + CMake (whisper.cpp native module)
        run: sdkmanager "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Fetch vendored sherpa-onnx AAR (Moonshine / SenseVoice; gitignored binary)
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          # Through the API with the job token first: anonymous GitHub release downloads (k2-fsa, also Maven via GitHub)
          # returned 504 for a while (2026-11-08); the plain URL stays as a fallback.
          AAR=sherpa-onnx-static-link-onnxruntime-2.0.1.aar
          gh release download v2.0.1 -R k2-fsa/sherpa-onnx -p "$AAR" -D app/libs --clobber || \
            curl -fSL --retry 8 --retry-all-errors --retry-delay 10 -o "app/libs/$AAR" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$AAR"
          ls -la app/libs

      - uses: actions/download-artifact@v4
        with:
          name: sherpa-qnn
          path: qnn-out

      - name: Put the QNN JNI and runtime into the sherpa AAR
        working-directory: android
        run: |
          set -e
          AAR=app/libs/sherpa-onnx-static-link-onnxruntime-2.0.1.aar
          rm -rf /tmp/aar && mkdir /tmp/aar && unzip -q "$AAR" -d /tmp/aar
          cp -v ../qnn-out/*.so /tmp/aar/jni/arm64-v8a/
          rm "$AAR" && (cd /tmp/aar && zip -qr - .) > "$AAR"
          unzip -l "$AAR" | grep arm64-v8a

      - name: Assemble debug + run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openwispr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Each push to main becomes a GitHub Release carrying the bare APK (no zip), tagged
      # build-<run>. Obtainium (or a browser) installs straight from it; only the newest
      # five builds are kept. Model releases (model-*) are never touched.
      - name: Publish build as release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          APK="openwispr-dev-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dev build ${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --format=%s)"
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do gh release delete "$old" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes; done
          # Model files are releases too; keep them pre-releases so "latest" is always an app build.
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select((.tagName | startswith("model-")) and (.isPrerelease | not)) | .tagName' |
            while read -r m; do gh release edit "$m" -R "$GITHUB_REPOSITORY" --prerelease; done
