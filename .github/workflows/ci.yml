name: CI

on:
  push:
    branches: [main]
    # Harness/doc-only commits don't make a new app build (and so no update prompt on the phone).
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "scripts/**"
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android build & unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish each main build as a release (Obtainium updates from it)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools". Google removed the obsolete "tools"
          # package from the SDK repository, so sdkmanager now exits 1 on it and
          # this step fails before anything is built — every Android run since
          # 2026-09-16 died here. We only need platform-tools; the NDK and CMake
          # come from the next step, and Gradle fetches platforms/build-tools.
          packages: platform-tools

      - name: Install NDK + CMake (whisper.cpp native module)
        run: sdkmanager "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Fetch vendored sherpa-onnx AAR (Moonshine / SenseVoice; gitignored binary)
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          # Through the API with the job token first: anonymous release downloads from k2-fsa
          # returned 504 for a while (2026-11-08); the plain URL stays as a fallback.
          AAR=sherpa-onnx-static-link-onnxruntime-2.0.1.aar
          gh release download v2.0.1 -R k2-fsa/sherpa-onnx -p "$AAR" -D app/libs --clobber || \
            curl -fSL --retry 8 --retry-all-errors --retry-delay 10 -o "app/libs/$AAR" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$AAR"
          ls -la app/libs

      - name: Assemble debug + run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openwispr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Each push to main becomes a GitHub Release carrying the bare APK (no zip), tagged
      # build-<run>. Obtainium (or a browser) installs straight from it; only the newest
      # five builds are kept. Model releases (model-*) are never touched.
      - name: Publish build as release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          APK="openwispr-dev-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dev build ${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --format=%s)"
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do gh release delete "$old" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes; done
          # Model files are releases too; keep them pre-releases so "latest" is always an app build.
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select((.tagName | startswith("model-")) and (.isPrerelease | not)) | .tagName' |
            while read -r m; do gh release edit "$m" -R "$GITHUB_REPOSITORY" --prerelease; done

  # macOS was not built here until #52 sat for eleven days with a one-line compile error and a
  # green PR, because the only job in this file was the Android one. Half the codebase had no
  # signal at all: the app target was never compiled, and OpenWisprCore's 119 unit tests never
  # ran. They pass, and always did. Nobody was watching.
  macos:
    name: macOS build & unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # First, because it is the cheap half. OpenWisprCore has no external dependencies, so
      # these run in seconds without fetching a single xcframework. A logic regression fails
      # here before the runner spends minutes downloading binaries to find out.
      - name: OpenWisprCore unit tests
        working-directory: macos/OpenWisprCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch vendored sherpa-onnx xcframeworks (on-device Parakeet STT; gitignored binaries)
        run: bash macos/SherpaOnnxFramework/fetch-binaries.sh

      - name: Generate Xcode project
        working-directory: macos/App
        run: ./generate.sh

      # Debug, not the DMG. release.yml already packages and signs on a tag; the question a PR
      # needs answered is only "does it still compile", and Debug answers it faster. Signing is
      # off because CI has no keychain identity and a compile check does not need one.
      - name: Build the app (Debug)
        working-directory: macos/App
        run: |
          xcodebuild -project OpenWispr.xcodeproj -scheme OpenWispr \
            -configuration Debug -destination 'platform=macOS' \
            build CODE_SIGNING_ALLOWED=NO
