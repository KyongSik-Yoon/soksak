# Builds Small ACFT (FUTO's audio-context fine-tune of whisper-small) as Qualcomm QNN context
# binaries for SM8850 and publishes them as a private pre-release, like npu-model.yml. sherpa-onnx
# has no ACFT build, so this runs its own recipe (export-whisper-qnn.yaml) on the ACFT weights:
# scripts/npu_acft_export.py on the runner, scripts/npu_compile_sm8850.sh in the QAIRT image.
name: Build Small ACFT NPU model (SM8850)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/npu-acft.yml
      - scripts/npu_acft_export.py
      - scripts/npu_compile_sm8850.sh

permissions:
  contents: write

env:
  SHERPA: 347ec768a01ca53e766780f7759b14e145b643e6
  NAME: sherpa-onnx-qnn-SM8850-binary-whisper-small-acft
  TAG: model-qnn-whisper-small-acft-sm8850

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/microsoft || true
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Export ONNX with the ACFT weights
        run: |
          set -ex
          python3 -m pip install -q torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q "numpy<2" openai-whisper onnx onnxruntime soundfile librosa "transformers<5" safetensors
          # scripts/whisper/qnn/export_onnx.py is a symlink to this file; raw URLs serve only its target.
          curl -fsSL --retry 5 -o export_onnx.py \
            "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$SHERPA/scripts/whisper/rknn/export_onnx.py"
          mkdir onnx && cd onnx
          python3 ../scripts/npu_acft_export.py ../export_onnx.py
          mv small-encoder.onnx encoder.onnx
          mv small-decoder.onnx decoder.onnx
          mv small-tokens.txt tokens.txt
          ls -la
      - name: Compile context binaries (QAIRT 2.40 image)
        run: docker run --rm -v "$PWD:/w" -e SHERPA -e NAME ghcr.io/k2-fsa/qnn-sdk:2.40 bash /w/scripts/npu_compile_sm8850.sh
      - uses: actions/upload-artifact@v4
        with:
          name: npu-model
          path: ${{ env.NAME }}.tar.bz2
          compression-level: 0

  publish:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npu-model
      - name: Publish as a private pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -ex
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "Small ACFT (NPU) for SM8850" \
              --notes "QNN context binaries of FUTO's ACFT whisper-small for Snapdragon 8 Elite Gen 5 (SM8850), compiled with QAIRT 2.40. Built by .github/workflows/npu-acft.yml."
          gh release upload "$TAG" "$NAME.tar.bz2" -R "$GITHUB_REPOSITORY" --clobber
